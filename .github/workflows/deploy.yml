name: Deploy Package

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
          - prerelease
          - prepatch
          - preminor
          - premajor
      tag:
        description: NPM Tag (and preid for pre-releases)
        required: true
        type: string
        default: latest

env:
  CACHE: true
  NODE_VERSION: "20.x"

jobs:
  test_js_client:
    name: JS client
    uses: ./.github/workflows/test.yml
    secrets: inherit

  deploy_js_client:
    name: JS client / Deploy
    runs-on: ubuntu-latest
    needs: test_js_client
    permissions:
      contents: write
      id-token: write
      pull-requests: write
    steps:
      - name: Git checkout
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.SVC_TOKEN }}

      - name: Install Node.js
        uses: metaplex-foundation/actions/install-node-with-pnpm@v1
        with:
          version: ${{ env.NODE_VERSION }}
          cache: ${{ env.CACHE }}

      - name: Install npm with trusted publishing support
        run: npm install -g "npm@>=11.5.1"

      - name: Install dependencies
        uses: metaplex-foundation/actions/install-node-dependencies@v1
        with:
          folder: ./clients/js
          cache: ${{ env.CACHE }}
          key: clients-js

      - name: Build
        working-directory: ./clients/js
        run: pnpm build

      - name: Bump
        id: bump
        working-directory: ./clients/js
        run: |
          if [ "${{ startsWith(inputs.bump, 'pre') }}" == "true" ]; then
            pnpm version ${{ inputs.bump }} --preid ${{ inputs.tag }} --no-git-tag-version
          else
            pnpm version ${{ inputs.bump }} --no-git-tag-version
          fi
          echo "new_version=$(node -e "console.log(require('./package.json').version)")" >> $GITHUB_OUTPUT

      - name: Publish
        working-directory: ./clients/js
        run: npm publish --access public --tag ${{ inputs.tag }}

      - name: Create release pull request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.SVC_TOKEN }}
          add-paths: clients/js/package.json
          commit-message: Deploy JS client v${{ steps.bump.outputs.new_version }}
          branch: release/js-client-v${{ steps.bump.outputs.new_version }}
          title: Deploy JS client v${{ steps.bump.outputs.new_version }}
          labels: release
          body: |
            `@metaplex-foundation/digital-asset-standard-api@${{ steps.bump.outputs.new_version }}`
            is published to npm. This pull request syncs `clients/js/package.json`
            with the registry.

            Merge it, then run the **Tag JS Release** workflow against `main` with
            version `${{ steps.bump.outputs.new_version }}` to create the
            `js@v${{ steps.bump.outputs.new_version }}` tag and its GitHub release.

  deploy_js_docs:
    name: JS client / Deploy docs
    runs-on: ubuntu-latest
    needs: deploy_js_client
    environment:
      name: js-client-documentation
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - name: Git checkout
        uses: actions/checkout@v3
        with:
          ref: ${{ github.ref }}

      - name: Deploy to Vercel
        id: deploy
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        working-directory: ./clients/js
        run: echo "url=$(vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }})" | tee $GITHUB_OUTPUT
